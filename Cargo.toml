[package]
name = "enso"
version = "0.3.2"
edition = "2024"
description = "A small Slack-to-CLI service with scheduled jobs"
repository = "https://github.com/geekforbrains/enso-light"
license = "MIT"
rust-version = "1.89"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
